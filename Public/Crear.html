<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../Estilos/crear.css">
</head>


<body>
    <a href=".././Index.html">
         <img class="contenedor-m" src="./../image/TalkTrack_logo2.1.png" alt="Logo">
    </a>


    <div class="login-container">
        <div class="login-card">
 <h1 class="logo">Registro de Usuario</h1>
        <form action="./../Index.html" method="post" class="formulario" novalidate>
           <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu Nombre" name="nombre">

            <label for="apellido">Apellido</label>
                <input type="text" id="apellido" placeholder="Tu apellido" name="apellido" required>

            <label for="fecha">Fecha de Nacimiento</label>
                <input type="date" id="apellido"  name="apellido" required>


            <label for="email">Correo Electronico</label>
                <input type="email" id="email" placeholder="Tu Email" name="email" required>

            <label for="Contraseña">Contraseña</label>
                <input type="password" id="password" placeholder="Tu Password" name="password" required>

                
            <input type="submit" class="boton"  value="Crear Cuenta">
        </form>
     
        <div class="register-text">¿Ya tienes una cuenta?
            <a href="./../Index.html"> Iniciar Sesión</a>
        </div>
    </div>     
</body>
