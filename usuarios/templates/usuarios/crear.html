{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro - TalkTrack</title>
    <link rel="stylesheet" href="{% static 'usuarios/css/login.css' %}">
</head>
<body>
    <a href="{% url 'login' %}"><img class="contenedor-m" src="{% static 'image/TalkTrack_logo2.1.png' %}" alt="Logo"></a>
    <div class="login-container">
        <div class="login-card">
            <h1 class="logo">Registro de Usuario</h1>
            <form method="post" class="formulario">
                {% csrf_token %}
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre">

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido">

                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password">

                <input type="submit" class="boton" value="Crear Cuenta">
            </form>
            <div class="register-text">¿Ya tienes una cuenta? <a href="{% url 'login' %}">Iniciar Sesión</a></div>
        </div>
    </div>
</body>
</html>
